services:
  wheel-fe:
    build:
      context: .
      dockerfile: wheel-fe/Dockerfile
    container_name: nakhoda-wheel-fe
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "0.0.0.0:${VITE_PORT:-5173}:5173"
    volumes:
      - ./wheel-fe/src:/app/src
    networks:
      - nakhoda-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nakhoda-network:
    driver: bridge
