version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nakhoda-postgres
    environment:
      POSTGRES_USER: nakhoda
      POSTGRES_PASSWORD: nakhoda
      POSTGRES_DB: nakhoda
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakhoda -d nakhoda"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakhoda-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nakhoda-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakhoda-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nakhoda-network:
    driver: bridge
