services:
  postgres:
    image: postgres:16-alpine
    container_name: nakhoda-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-nakhoda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nakhoda}
      POSTGRES_DB: ${DB_NAME:-nakhoda}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "0.0.0.0:${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nakhoda} -d ${DB_NAME:-nakhoda}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakhoda-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nakhoda-redis
    command: redis-server --appendonly yes
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nakhoda-network
    restart: unless-stopped

  wheel:
    build:
      context: .
      dockerfile: wheel-be/Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BE_PORT: ${BE_PORT:-}
      FE_WS_PORT: ${FE_WS_PORT:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      RUDDER_TOKENS: ${RUDDER_TOKENS:-}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      - postgres
      - redis
    networks:
      - nakhoda-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nakhoda-network:
    driver: bridge
