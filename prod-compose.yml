services:
  wheel:
    build:
      context: .
      dockerfile: wheel-be/Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add other environment variables (DB, REDIS, etc) as needed or use an env_file
    restart: unless-stopped

  # Add other production services here (postgres, redis) or deploy them separately
